[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulmoai-model-training"
version = "0.2.0"
description = "PulmoAI research pipelines for CT pulmonary nodule detection"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "PulmoAI contributors" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7",
  "pytest>=8.0",
  "ruff>=0.5",
  "numpy>=1.26",
]
ct = ["numpy>=1.26", "scipy>=1.11", "torch>=2.3,<3", "SimpleITK>=2.3,<3", "pillow>=10"]
tracking = ["mlflow>=2.12"]

[project.scripts]
pulmoai = "pulmoai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
