name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
      RESPIRATORY_XRAY_ALLOW_NETWORK: "0"
      PULMOAI_ALLOW_NETWORK: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install CT and development dependencies
        run: python -m pip install -e ".[dev,ct]"
      - name: Lint
        run: ruff check .
      - name: Test synthetic suite
        run: python -m pytest
